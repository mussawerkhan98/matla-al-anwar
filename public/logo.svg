<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
 <defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00B8F5"/><stop offset="1" stop-color="#003C99"/></linearGradient>
  <linearGradient id="s" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#F5A623"/><stop offset="1" stop-color="#FFD66B"/></linearGradient>
 </defs>
 <circle cx="100" cy="100" r="96" fill="url(#g)"/>
 <circle cx="100" cy="100" r="86" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
 <!-- rising sun rays -->
 <g stroke="url(#s)" stroke-width="7" stroke-linecap="round">
  <line x1="100" y1="58" x2="100" y2="40"/><line x1="70" y1="70" x2="58" y2="56"/><line x1="130" y1="70" x2="142" y2="56"/>
  <line x1="56" y1="96" x2="38" y2="90"/><line x1="144" y1="96" x2="162" y2="90"/>
 </g>
 <path d="M58 112 A42 42 0 0 1 142 112 Z" fill="url(#s)"/>
 <!-- snowflake in sun -->
 <g stroke="#fff" stroke-width="4" stroke-linecap="round" transform="translate(100 96)">
  <line x1="0" y1="-26" x2="0" y2="14"/><line x1="-18" y1="-16" x2="18" y2="4"/><line x1="18" y1="-16" x2="-18" y2="4"/>
 </g>
 <!-- road / horizon -->
 <rect x="30" y="112" width="140" height="6" rx="3" fill="#fff"/>
 <text x="100" y="146" text-anchor="middle" font-family="Inter" font-weight="800" font-size="22" fill="#fff" letter-spacing="1">MATLA AL</text>
 <text x="100" y="170" text-anchor="middle" font-family="Inter" font-weight="800" font-size="22" fill="#fff" letter-spacing="3">ANWAR</text>
</svg>
